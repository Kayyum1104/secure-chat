<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Room</title>
<style>
  :root { --bg:#eef1f4; --panel:#fff; --ink:#1b2430; --muted:#6a7584; --accent:#1f5eff; --mine:#dfe9ff; --line:#d9dee5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171e; --panel:#1a212b; --ink:#e7ecf2; --muted:#8c97a6; --accent:#6d97ff; --mine:#243456; --line:#2a3340; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.5 "Trebuchet MS", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #login { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; width: 100%; max-width: 380px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .92rem; }
  label { display: block; font-size: .88rem; margin: 12px 0 4px; color: var(--muted); }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  .card .btn { width: 100%; margin-top: 18px; }
  .err { color: #d2392f; font-size: .9rem; min-height: 1.3em; margin-top: 10px; }

  #chat { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--panel); border-inline: 1px solid var(--line); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header strong { font-size: 1.05rem; }
  header small { display: block; color: var(--muted); font-size: .78rem; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; background: var(--bg); align-self: flex-start; overflow-wrap: anywhere; }
  .msg.mine { background: var(--mine); align-self: flex-end; }
  .meta { font-size: .76rem; color: var(--muted); margin-bottom: 2px; }
  .empty { color: var(--muted); text-align: center; margin: auto; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  form input { flex: 1; }
</style>
</head>
<body>
<section id="login">
  <div class="card">
    <h1>Private Room</h1>
    <p class="sub">Sign in to join the conversation.</p>
    <form id="loginForm" style="display:block;padding:0;border:0">
      <label for="u">Username</label>
      <input id="u" autocomplete="username" required>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="loginErr" role="alert"></div>
    </form>
  </div>
</section>

<section id="chat" hidden>
  <header>
    <div><strong>Private Room</strong><small>Messages are deleted after 10 days</small></div>
    <div><span id="me" style="color:var(--muted);font-size:.9rem"></span> <button class="link" id="out">Sign out</button></div>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="send">
    <input id="text" placeholder="Write a message" autocomplete="off" maxlength="2000" required>
    <button class="btn" type="submit">Send</button>
  </form>
</section>

<script>
const $ = id => document.getElementById(id);
let ws, myName = '', retry;

function show(loggedIn) { $('login').hidden = loggedIn; $('chat').hidden = !loggedIn; }

function render(list) {
  const log = $('log'); log.innerHTML = '';
  if (!list.length) { log.innerHTML = '<p class="empty">No messages yet. Say hello.</p>'; return; }
  list.forEach(add);
}
function add(m) {
  const log = $('log');
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg' + (m.name === myName ? ' mine' : '');
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = m.name + '  ' + new Date(m.time).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  const body = document.createElement('div'); body.textContent = m.text;
  d.append(meta, body); log.append(d);
  log.scrollTop = log.scrollHeight;
}

function connect() {
  const token = sessionStorage.getItem('token'); if (!token) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/?token=${token}`);
  ws.onopen = () => show(true);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'history') render(d.messages); else add(d.message);
  };
  ws.onclose = () => {
    if (!sessionStorage.getItem('token')) return;
    fetch('/', { method: 'HEAD' }); // keep trying while signed in
    retry = setTimeout(connect, 2000);
  };
  ws.onerror = () => { /* invalid/expired token */ if (ws.readyState !== 1) {} };
}

$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('loginErr').textContent = '';
  const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('u').value, password: $('p').value }) });
  const d = await r.json();
  if (!r.ok) { $('loginErr').textContent = d.error; return; }
  myName = prompt('Choose a display name for this chat:', '')?.trim().slice(0, 24) || 'Guest';
  sessionStorage.setItem('token', d.token); sessionStorage.setItem('name', myName);
  $('me').textContent = myName; $('p').value = '';
  connect();
};

$('send').onsubmit = e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ name: myName, text }));
  $('text').value = '';
};

$('out').onclick = () => {
  sessionStorage.clear(); clearTimeout(retry); ws && ws.close(); show(false);
};

if (sessionStorage.getItem('token')) {
  myName = sessionStorage.getItem('name') || 'Guest'; $('me').textContent = myName; connect();
}
</script>
</body>
</html>
